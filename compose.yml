x-service-env: &service-env
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_PORT: ${POSTGRES_PORT}
  CONSUL_HTTP_ADDR: http://consul:8500
  KAFKA_BROKER: kafka:9092

x-back-env: &back-env
  <<: *service-env
  INMUEBLES_GRPC_ADDR: nginx:8001

x-servicios-env: &servicios-env
  <<: *service-env
  ROOMS_GRPC_ADDR: nginx:8001

services:
  front:
    build:
      context: ./front/
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - "nginx"

  # middleware:
  #   build:
  #     context: ./middleware/
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - "loadbalancer"

  # loadbalancer:
  #   build:
  #     context: ./loadbalancer/
  #     dockerfile: Dockerfile
  #   ports:
  #     - "9000:9000"
  #   depends_on:
  #     - "back-1"
  #     - "back-2"
  #     - "servicios-1"
  #     - "servicios-2"
  #     - "inmuebles-1"
  #     - "inmuebles-2"

  nginx:
    image: nginx:alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - back-1
      - back-2
      - servicios-1
      - servicios-2
      - inmuebles-1
      - inmuebles-2

  consul:
    image: hashicorp/consul:latest
    command: "agent -dev -client=0.0.0.0 -ui"
    ports:
      - "8500:8500"

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  back-1: &back-base
    build:
      context: ./back/
      dockerfile: Dockerfile
    environment:
      <<: *back-env
      INSTANCE_ID: back-1
    depends_on:
      - "db"
      - "consul"
      - "kafka"

  back-2:
    <<: *back-base
    environment:
      <<: *back-env
      INSTANCE_ID: back-2

  servicios-1: &servicios-base
    build:
      context: ./servicios/
      dockerfile: Dockerfile
    environment:
      <<: *servicios-env
      INSTANCE_ID: servicios-1
    depends_on:
      - "db"
      - "consul"
      - "kafka"

  servicios-2:
    <<: *servicios-base
    environment:
      <<: *servicios-env
      INSTANCE_ID: servicios-2

  inmuebles-1: &inmuebles-base
    build:
      context: ./inmuebles/
      dockerfile: Dockerfile
    environment:
      <<: *service-env
      INSTANCE_ID: inmuebles-1
    depends_on:
      - "db"
      - "consul"
      - "kafka"

  inmuebles-2: 
    <<: *inmuebles-base
    environment:
      <<: *service-env
      INSTANCE_ID: inmuebles-2

  db:
    image: postgres:18.4-alpine3.24
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:

