services:
  front:
    build:
      context: ./front/
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - "back"

  middleware:
    build:
      context: ./middleware/
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - "loadbalancer"

  loadbalancer:
    build:
      context: ./loadbalancer/
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    depends_on:
      - "back"
      - "servicios"
      - "inmuebles"

  back:
    build:
      context: ./back/
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "4000:4000"
    depends_on:
      - "db"

  servicios:
    build:
      context: ./servicios/
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "4001:4001"
    depends_on:
      - "db"

  inmuebles:
    build:
      context: ./inmuebles/
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "4002:4002"
    depends_on:
      - "db"

  db:
    image: postgres:18.4-alpine3.24
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

  # volumes:
  #   pgdata:

