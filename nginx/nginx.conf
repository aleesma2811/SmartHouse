events {}

http {
    # Manda cada log en formato lb

    # $remote_addr: IP de quien hizo la oetición
    # $request: Línea de petición
    # $upstream_addr: IP y puerto de la instancia que lleva a cabo la petición
    # $status: Respuesta HTTP
    log_format lb '$remote_addr "$request" -> $upstream_addr [$status]';
    access_log /dev/stdout lb;

    # Equivalente a Targets []string
    upstream rooms_pool {
        # max_fails=3 fail_timeout=30s: Health check pasivo
        server back-1:4000 max_fails=3 fail_timeout=30s;
        server back-2:4000 max_fails=3 fail_timeout=30s;
    }

    upstream servicios_pool {
        server servicios-1:4001 max_fails=3 fail_timeout=30s;
        server servicios-2:4001 max_fails=3 fail_timeout=30s;
    }

    upstream inmuebles_pool {
        server inmuebles-1:4002 max_fails=3 fail_timeout=30s;
        server inmuebles-2:4002 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8000;

        # CORS
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        # Headers hacia el backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Match por prefijo
        location /rooms {
            if ($request_method = OPTIONS) {
                return 204;
            }
            # Reenvía la petición al upstream
            proxy_pass http://rooms_pool;
        }

        location /servicios {
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass http://servicios_pool;
        }
        
        location /inmuebles {
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass http://inmuebles_pool;
        }


        location /heartbeat {
            default_type text/plain;
            return 200 "nginx gateway alive";
        }
    }
}