server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Go backend exposes its API at the root ("/rooms", "/plugs") with
    # no CORS headers. Proxying those paths through this same origin lets
    # the React app call them with plain relative fetches, no CORS needed.
    location /rooms {
        proxy_pass http://back:4000;
        proxy_set_header Host $host;
    }

    location /plugs {
        proxy_pass http://back:4000;
        proxy_set_header Host $host;
    }

    # Client-side routes (React Router) fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
